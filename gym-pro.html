var historyFilter = 'all';

function renderHistory() {
    var html = '';
    
    // Filtros
    var filters = [
        {id: 'all', name: 'Todos'},
        {id: 'week', name: 'Esta semana'},
        {id: 'month', name: 'Este mes'}
    ];
    
    document.getElementById('hist-filters').innerHTML = filters.map(function(f) {
        return '<button class="hist-filter' + (historyFilter === f.id ? ' active' : '') + '" onclick="filterHistory(\'' + f.id + '\')">' + f.name + '</button>';
    }).join('');
    
    if (!DATA.history || DATA.history.length === 0) {
        document.getElementById('hist-list').innerHTML = '<div class="hist-empty"><div class="hist-empty-icon">📜</div><p>No hay entrenos registrados</p><p style="font-size:0.8rem">¡Completa tu primer entreno!</p></div>';
        return;
    }
    
    // Filtrar según selección
    var now = new Date();
    var filtered = DATA.history.filter(function(h) {
        if (historyFilter === 'all') return true;
        
        var parts = h.date.split('-');
        var entryDate = new Date(parseInt(parts[0]), parseInt(parts[1]), parseInt(parts[2]));
        
        if (historyFilter === 'week') {
            var weekAgo = new Date(now);
            weekAgo.setDate(weekAgo.getDate() - 7);
            return entryDate >= weekAgo;
        }
        if (historyFilter === 'month') {
            var monthAgo = new Date(now);
            monthAgo.setMonth(monthAgo.getMonth() - 1);
            return entryDate >= monthAgo;
        }
        return true;
    });
    
    if (filtered.length === 0) {
        document.getElementById('hist-list').innerHTML = '<div class="hist-empty"><div class="hist-empty-icon">🔍</div><p>No hay entrenos en este período</p></div>';
        return;
    }
    
    // Ordenar por fecha (más reciente primero)
    filtered.sort(function(a, b) {
        return b.date.localeCompare(a.date);
    });
    
    // Renderizar tarjetas
    html = filtered.map(function(h, idx) {
        var exCompleted = 0;
        var totalVol = 0;
        var totalSets = 0;
        
        if (h.exercises) {
            h.exercises.forEach(function(e) {
                if (e.completed) exCompleted++;
                if (e.sets) {
                    e.sets.forEach(function(s) {
                        if (s.weight > 0 && s.reps > 0) {
                            totalVol += s.weight * s.reps;
                            totalSets++;
                        }
                    });
                }
            });
        }
        
        // Formatear fecha
        var parts = h.date.split('-');
        var dateStr = parts[2] + '/' + (parseInt(parts[1]) + 1) + '/' + parts[0];
        
        return '<div class="hist-card" onclick="openHistDetail(\'' + h.date + '\')">' +
            '<div class="hist-card-header">' +
                '<div><div class="hist-card-day">' + (h.dayName || 'Entreno') + '</div><div class="hist-card-date">' + dateStr + '</div></div>' +
                (exCompleted > 0 ? '<div class="hist-card-badge">✓ Completado</div>' : '') +
            '</div>' +
            '<div class="hist-card-title">' + (h.planName || 'Entreno') + '</div>' +
            '<div class="hist-card-stats">' +
                '<div class="hist-card-stat">💪 <span>' + exCompleted + '</span> ejercicios</div>' +
                '<div class="hist-card-stat">🏋️ <span>' + Math.round(totalVol/1000) + 'K</span> kg</div>' +
                '<div class="hist-card-stat">📊 <span>' + totalSets + '</span> series</div>' +
            '</div>' +
        '</div>';
    }).join('');
    
    document.getElementById('hist-list').innerHTML = html;
}

function openHistDetail(date) {

    var html = '<div class="hist-detail-meta">' + (entry.dayName || '') + ' · ' + dateStr + '</div>';
    
    // Calcular PR de este entreno para marcarlos
    var prInSession = {};

        entry.exercises.forEach(function(e) {
            if (e.sets) {
                var bestRM = 0;
                var bestIdx = -1;
                e.sets.forEach(function(s, i) {
                    if (s.weight > 0 && s.reps > 0) {

                            bestIdx = i;

    if (entry.exercises && entry.exercises.length > 0) {
        sections.forEach(function(sec) {

    }
    
    document.getElementById('hist-detail-body').innerHTML = html;

// ============ XP & LEVEL SYSTEM ============
if(!DATA.xp) DATA.xp = 0;
if(!DATA.badges) DATA.badges = [];
if(!DATA.bestStreak) DATA.bestStreak = 0;

function addXP(amount, reason) {
    var oldLevel = Math.floor(DATA.xp / 100) + 1;
    DATA.xp += amount;
    var newLevel = Math.floor(DATA.xp / 100) + 1;
    save();
    if (newLevel > oldLevel) {
        showCelebration('⭐', '¡NIVEL ' + newLevel + '!', 'Has subido de nivel');
    } else if (reason) {
        showToast('✨', '+' + amount + ' XP: ' + reason);
    }
    checkAllBadges();
}

function checkAllBadges() {
    var stats = calcAdvancedStats();
    stats.level = Math.floor(DATA.xp / 100) + 1;
    stats.streak = calcStreak();
    
    BADGES.forEach(function(badge) {
        if (!DATA.badges.includes(badge.id) && badge.check(stats)) {
            DATA.badges.push(badge.id);
            save();
            setTimeout(function() {
                showCelebration(badge.icon, '¡LOGRO DESBLOQUEADO!', badge.name);
            }, 500);
        }
    });
}

function calcStreak() {
    var streak = 0;
    var now = new Date(); now.setHours(0,0,0,0);
    for (var i = 0; i < 365; i++) {
        var d = new Date(now);
        d.setDate(d.getDate() - i);
        var k = d.getFullYear() + '-' + d.getMonth() + '-' + d.getDate();
        var has = DATA.history.some(function(h) { return h.date === k; });
        var isRest = PLAN[d.getDay()] && PLAN[d.getDay()].rest;
        if (has || isRest) { if (!isRest) streak++; }
        else if (i > 0) break;
    }
    if (streak > DATA.bestStreak) { DATA.bestStreak = streak; save(); }
    return streak;
}

// ============ HEATMAP ============
function generateHeatmap() {
    var today = new Date(); today.setHours(0,0,0,0);
    var weeks = [];
    var workoutDates = {};
    DATA.history.forEach(function(h) { workoutDates[h.date] = (workoutDates[h.date] || 0) + 1; });
    
    for (var w = 11; w >= 0; w--) {
        var week = [];
        for (var d = 0; d < 7; d++) {
            var date = new Date(today);
            date.setDate(date.getDate() - date.getDay() - w * 7 + d);
            var key = date.getFullYear() + '-' + date.getMonth() + '-' + date.getDate();
            var count = workoutDates[key] || 0;
            var isToday = date.getTime() === today.getTime();
            week.push({date: date, key: key, count: count, isToday: isToday});
        }
        weeks.push(week);
    }
    return weeks;
}

// ============ PREDICCIONES ============
function predictNextPR(exName) {
    var weights = [];
    DATA.history.forEach(function(h) {
        if (h.exercises) h.exercises.forEach(function(e) {
            if (e.name === exName && e.sets) e.sets.forEach(function(s) {
                if (s.weight > 0) weights.push(s.weight);
            });
        });
    });
    if (weights.length < 3) return null;
    var last3 = weights.slice(-3);
    var avg = last3.reduce(function(a,b){return a+b;}, 0) / 3;
    var trend = (last3[2] - last3[0]) / 2;
    return Math.round(avg + trend + 2.5);
}

// ============ STATS AVANZADOS ============
function calcAdvancedStats() {
    var totalVol = 0, totalEx = 0, prs = {}, exByMuscle = {};
    var colors = {pierna:'#ff3e00',pecho:'#00ff88',espalda:'#00c8ff',hombro:'#a855f7',brazo:'#ec4899',core:'#ffaa00',cardio:'#4ade80',movilidad:'#38bdf8'};
    
    DATA.history.forEach(function(h) {
        if (h.exercises) h.exercises.forEach(function(e) {
            if (e.completed) totalEx++;
            if (e.sets) e.sets.forEach(function(s) {
                if (s.weight > 0 && s.reps > 0) {
                    var vol = s.weight * s.reps;
                    totalVol += vol;
                    var rm = Math.round(s.weight * (36 / (37 - s.reps)));
                    if (!prs[e.name] || rm > prs[e.name].rm) {
                        prs[e.name] = {rm: rm, weight: s.weight, reps: s.reps, date: h.date};
                    }
                    var muscle = e.cat || 'otro';
                    exByMuscle[muscle] = (exByMuscle[muscle] || 0) + vol;
                }
            });
        });
    });
    return {totalVol: totalVol, totalEx: totalEx, prs: prs, exByMuscle: exByMuscle, colors: colors, totalWorkouts: DATA.history.length};
}

    // Predicciones
    if (prList.length >= 3) {
        html += '<div class="predict-card"><div class="predict-title">🔮 Predicción próximo PR</div>';
        prList.slice(0,4).forEach(function(name) {
            var pred = predictNextPR(name);
            if (pred) {
                html += '<div class="predict-row"><span class="predict-name">' + name + '</span><span class="predict-val">~' + pred + ' kg</span></div>';
            }
        });
        html += '</div>';
    }
    
    // Músculo pie chart
    var muscles = stats.exByMuscle;
    var muscleTotal = Object.values(muscles).reduce(function(a,b){return a+b;}, 0) || 1;
    if (Object.keys(muscles).length > 0) {
        html += '<div class="stats-card"><div class="stats-card-title">🎯 Por Músculo</div>';
        html += '<div class="pie-container"><div class="pie-chart" style="background:conic-gradient(';
        var angle = 0, gradParts = [];
        Object.keys(muscles).forEach(function(m) {
            var pct = (muscles[m] / muscleTotal) * 100;
            gradParts.push((stats.colors[m] || '#666') + ' ' + angle + 'deg ' + (angle + pct * 3.6) + 'deg');
            angle += pct * 3.6;
        });
        html += gradParts.join(',') + ')"></div><div class="pie-legend">';
        Object.keys(muscles).forEach(function(m) {
            var pct = Math.round((muscles[m] / muscleTotal) * 100);
            html += '<div class="pie-legend-item"><div class="pie-legend-dot" style="background:' + (stats.colors[m] || '#666') + '"></div>' + m + ' ' + pct + '%</div>';
        });
        html += '</div></div></div>';
    }
    
    document.getElementById('stats-content').innerHTML = html;
}

// ============ BADGES TAB ============
function renderBadges() {
    var stats = calcAdvancedStats();
    stats.level = Math.floor(DATA.xp / 100) + 1;
    stats.streak = calcStreak();
    var html = '';
    
    html += '<div class="stats-card"><div class="stats-card-title">🏆 Logros (' + DATA.badges.length + '/' + BADGES.length + ')</div>';
    html += '<div class="badges-grid">';
    BADGES.forEach(function(b) {
        var unlocked = DATA.badges.includes(b.id);
        html += '<div class="badge' + (unlocked ? ' unlocked' : '') + '" title="' + b.desc + '"><div class="badge-icon">' + b.icon + '</div><div class="badge-name">' + b.name + '</div></div>';
    });
    html += '</div></div>';
    
    // Timer de entreno
    html += '<div class="timer-card"><div class="timer-label">⏱️ CRONÓMETRO</div><div class="timer-display" id="manual-timer">00:00</div>';
    html += '<div class="timer-btns"><button class="timer-btn start" onclick="startManualTimer()">▶ Iniciar</button><button class="timer-btn pause" onclick="pauseManualTimer()">⏸ Pausar</button><button class="timer-btn reset" onclick="resetManualTimer()">↺ Reset</button></div></div>';
    
    document.getElementById('badges-content').innerHTML = html;
}

var manualTimerInterval = null;
var manualTimerSeconds = 0;
var manualTimerRunning = false;

function startManualTimer() {
    if (manualTimerRunning) return;
    manualTimerRunning = true;
    manualTimerInterval = setInterval(function() {
        manualTimerSeconds++;
        var m = Math.floor(manualTimerSeconds / 60);
        var s = manualTimerSeconds % 60;
        document.getElementById('manual-timer').textContent = String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
    }, 1000);
}
function pauseManualTimer() {
    manualTimerRunning = false;
    if (manualTimerInterval) clearInterval(manualTimerInterval);
}
function resetManualTimer() {
    pauseManualTimer();
    manualTimerSeconds = 0;
    document.getElementById('manual-timer').textContent = '00:00';
}

// ============ EXPORTAR / IMPORTAR ============
function exportJSON() {
    var data = {lib: LIB, plan: PLAN, data: DATA, version: 'gym-pro-ultimate', date: new Date().toISOString()};
    var blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'gym-backup-' + new Date().toISOString().split('T')[0] + '.json';
    a.click();
    URL.revokeObjectURL(url);
    showToast('✅', 'Backup exportado');
}

function importJSON(input) {
    var file = input.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(e) {
        try {
            var data = JSON.parse(e.target.result);
            if (data.lib) LIB = data.lib;
            if (data.plan) PLAN = data.plan;
            if (data.data) DATA = data.data;
            if (!DATA.xp) DATA.xp = 0;
            if (!DATA.badges) DATA.badges = [];
            if (!DATA.bestStreak) DATA.bestStreak = 0;
            save();
            showCelebration('📥', '¡RESTAURADO!', 'Datos importados correctamente');
            renderToday();
        } catch(err) {
            alert('Error: ' + err.message);
        }
    };
    reader.readAsText(file);
    input.value = '';
}

function exportCSV() {
    var csv = 'Fecha,Día,Plan,Ejercicio,Categoría,Serie,Peso,Reps,Volumen,1RM\n';
    DATA.history.forEach(function(h) {
        if (h.exercises) h.exercises.forEach(function(e) {
            if (e.sets) e.sets.forEach(function(s, i) {
                if (s.weight > 0) {
                    var rm = Math.round(s.weight * (36 / (37 - (s.reps || 1))));
                    csv += h.date + ',' + (h.dayName||'') + ',' + (h.planName||'') + ',' + e.name + ',' + (e.cat||'') + ',' + (i+1) + ',' + s.weight + ',' + (s.reps||0) + ',' + (s.weight * (s.reps||0)) + ',' + rm + '\n';
                }
            });
        });
    });
    var blob = new Blob([csv], {type: 'text/csv'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'gym-' + new Date().toISOString().split('T')[0] + '.csv';
    a.click();
    URL.revokeObjectURL(url);
    showToast('✅', 'CSV exportado');
}

// ============ CHECK PR ============
function checkPR(exName, weight, reps) {
    if (!weight || !reps || weight <= 0 || reps <= 0) return;
    var rm = Math.round(weight * (36 / (37 - reps)));
    var oldPR = null;
    DATA.history.forEach(function(h) {
        if (h.exercises) h.exercises.forEach(function(e) {
            if (e.name === exName && e.sets) e.sets.forEach(function(s) {
                if (s.weight > 0 && s.reps > 0) {
                    var oldRM = Math.round(s.weight * (36 / (37 - s.reps)));
                    if (!oldPR || oldRM > oldPR) oldPR = oldRM;
                }
            });
        });
    });
    if (!oldPR || rm > oldPR) {
        showCelebration('🏆', '¡NUEVO PR!', exName + ': ' + rm + 'kg (1RM)');
        addXP(25, 'Nuevo PR');
    }
}
