<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GYM PRO</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root{--bg:#09090b;--card:#141416;--card2:#1c1c1f;--accent:#ff3e00;--glow:rgba(255,62,0,0.25);--success:#00ff88;--warn:#ffaa00;--info:#00c8ff;--purple:#a855f7;--text:#fff;--text2:#a0a0a0;--text3:#606060;--border:#2a2a2f;--fire:linear-gradient(135deg,#ff3e00,#ff6b35,#ffaa00)}
        *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
        body{font-family:'Space Grotesk',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
        .app{max-width:500px;margin:0 auto;padding:12px;padding-bottom:100px}
        .header{text-align:center;padding:16px 0;border-bottom:2px solid;border-image:var(--fire) 1}
        .logo{font-family:'Bebas Neue',sans-serif;font-size:2.2rem;letter-spacing:5px;background:var(--fire);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        .nav{display:flex;gap:3px;margin:14px 0;padding:3px;background:var(--card);border-radius:10px}
        .nav-btn{flex:1;padding:9px 4px;background:0;border:0;color:var(--text2);font-family:inherit;font-size:0.7rem;font-weight:600;cursor:pointer;border-radius:7px;transition:0.2s}
        .nav-btn.active{background:var(--accent);color:#fff}
        .week-box{background:var(--card);border-radius:12px;padding:12px;margin-bottom:12px}
        .week-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
        .week-head h3{font-size:0.75rem}
        .week-head span{font-family:'JetBrains Mono',monospace;font-size:0.75rem;color:var(--accent)}
        .week-days{display:flex;gap:5px}
        .week-day{flex:1;text-align:center}
        .week-day-name{font-size:0.5rem;color:var(--text3);margin-bottom:4px}
        .week-day-circle{width:30px;height:30px;margin:0 auto;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:0.65rem;color:var(--text3);cursor:pointer;transition:0.2s}
        .week-day-circle.done{background:var(--success);border-color:var(--success);color:var(--bg)}
        .week-day-circle.today{border-color:var(--accent);color:var(--accent)}
        .week-day-circle.rest{background:var(--card2);border-style:dashed}
        .week-bar{height:5px;background:var(--border);border-radius:3px;margin-top:10px;overflow:hidden}
        .week-bar-fill{height:100%;background:var(--fire);transition:width 0.3s}
        .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px}
        .stat{background:var(--card);border-radius:8px;padding:10px 6px;text-align:center}
        .stat-val{font-family:'Bebas Neue',sans-serif;font-size:1.6rem;background:var(--fire);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        .stat-lbl{font-size:0.5rem;color:var(--text3);text-transform:uppercase}
        .today-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
        .today-date{font-family:'JetBrains Mono',monospace;font-size:0.6rem;color:var(--text3)}
        .today-day{font-family:'Bebas Neue',sans-serif;font-size:1.4rem;letter-spacing:2px}
        .today-badge{padding:5px 10px;background:var(--card);border:1px solid var(--accent);border-radius:16px;font-size:0.75rem;color:var(--accent)}
        .gym-btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:12px;margin-bottom:12px;background:var(--fire);border:0;border-radius:10px;color:#fff;font-family:'Bebas Neue',sans-serif;font-size:1.1rem;letter-spacing:2px;cursor:pointer;box-shadow:0 4px 15px var(--glow)}
        .sec-title{font-family:'JetBrains Mono',monospace;font-size:0.6rem;color:var(--text3);letter-spacing:2px;margin:14px 0 8px;display:flex;align-items:center;gap:6px}
        .sec-title::after{content:'';flex:1;height:1px;background:var(--border)}
        .ex-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px;margin-bottom:6px}
        .ex-card.done{opacity:0.5;border-color:var(--success)}
        .ex-card.warmup{border-left:3px solid var(--warn)}
        .ex-card.cardio{border-left:3px solid var(--info)}
        .ex-card.accessory{border-left:3px solid var(--purple)}
        .ex-top{display:flex;gap:8px}
        .ex-media{width:50px;height:50px;background:var(--bg);border-radius:8px;overflow:hidden;flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center}
        .ex-media img,.ex-media video{width:100%;height:100%;object-fit:cover}
        .ex-media svg{width:24px;height:24px;stroke:var(--text3);stroke-width:1.5;fill:none}
        .ex-info{flex:1;min-width:0}
        .ex-name{font-size:0.85rem;font-weight:600}
        .ex-meta{font-family:'JetBrains Mono',monospace;font-size:0.6rem;color:var(--text2)}
        .ex-notes{font-size:0.68rem;color:var(--text2);margin-top:5px;padding:5px;background:var(--bg);border-radius:4px;border-left:2px solid var(--accent)}
        .ex-sets{display:grid;grid-template-columns:repeat(auto-fit,minmax(65px,1fr));gap:4px;margin-top:8px}
        .set-box{background:var(--bg);border-radius:6px;padding:6px 4px;text-align:center}
        .set-label{font-family:'JetBrains Mono',monospace;font-size:0.45rem;color:var(--text3);margin-bottom:3px}
        .set-inputs{display:flex;gap:2px;align-items:center;justify-content:center}
        .set-input{width:30px;padding:5px 2px;background:var(--card);border:1px solid var(--border);border-radius:4px;color:var(--text);font-family:'JetBrains Mono',monospace;font-size:0.8rem;text-align:center}
        .set-input:focus{outline:0;border-color:var(--accent)}
        .set-x{color:var(--text3);font-size:0.5rem}
        .set-last{font-size:0.45rem;color:var(--success);margin-top:2px}
        .done-btn{display:flex;align-items:center;justify-content:center;width:100%;padding:8px;margin-top:8px;background:0;border:2px dashed var(--border);border-radius:6px;color:var(--text2);font-family:inherit;font-size:0.7rem;font-weight:600;cursor:pointer}
        .done-btn:hover{border-color:var(--success);color:var(--success)}
        .done-btn.checked{background:rgba(0,255,136,0.1);border-color:var(--success);border-style:solid;color:var(--success)}
        .notes-box{margin-top:14px;padding:12px;background:var(--card);border-radius:10px}
        .notes-area{width:100%;min-height:60px;padding:8px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:inherit;font-size:0.8rem;resize:vertical}
        .notes-area:focus{outline:0;border-color:var(--accent)}
        .empty{text-align:center;padding:30px;color:var(--text3)}
        .empty-icon{font-size:2rem;margin-bottom:8px}
        .empty-btn{margin-top:10px;padding:8px 16px;background:var(--accent);color:#fff;border:0;border-radius:6px;cursor:pointer}
        .rest{text-align:center;padding:30px;background:var(--card);border-radius:12px}
        .rest-emoji{font-size:2.5rem;margin-bottom:10px}
        .rest-title{font-family:'Bebas Neue',sans-serif;font-size:1.4rem;letter-spacing:2px}
        .tab{display:none}.tab.active{display:block;animation:fadeIn 0.2s}
        @keyframes fadeIn{from{opacity:0}to{opacity:1}}
        .lib-header{display:flex;gap:6px;margin-bottom:12px}
        .lib-btn{flex:1;padding:10px;background:var(--card);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:0.75rem;font-weight:600;cursor:pointer}
        .lib-btn.primary{background:var(--fire);border:0}
        .lib-filters{display:flex;gap:4px;margin-bottom:12px;overflow-x:auto;padding-bottom:4px}
        .lib-filter{padding:5px 12px;background:var(--card);border:1px solid var(--border);border-radius:16px;color:var(--text2);font-size:0.65rem;cursor:pointer;white-space:nowrap}
        .lib-filter.active{background:var(--accent);border-color:var(--accent);color:#fff}
        .lib-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
        .lib-card{background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden;cursor:pointer}
        .lib-card:hover{border-color:var(--accent)}
        .lib-card-media{height:80px;background:var(--bg);display:flex;align-items:center;justify-content:center;overflow:hidden}
        .lib-card-media img,.lib-card-media video{width:100%;height:100%;object-fit:cover}
        .lib-card-media svg{width:30px;height:30px;stroke:var(--text3);fill:none}
        .lib-card-body{padding:8px}
        .lib-card-name{font-size:0.8rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .lib-card-meta{font-size:0.6rem;color:var(--text3)}
        .lib-card-actions{display:flex;gap:4px;margin-top:6px}
        .lib-card-action{flex:1;padding:5px;background:var(--bg);border:1px solid var(--border);border-radius:4px;color:var(--text2);font-size:0.6rem;cursor:pointer;text-align:center}
        .lib-card-action:hover{border-color:var(--accent);color:var(--accent)}
        .lib-card-action.add{background:var(--accent);border-color:var(--accent);color:#fff}
        .plan-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:6px;cursor:pointer}
        .plan-card:hover{border-color:var(--accent)}
        .plan-card.today{border-color:var(--accent);background:rgba(255,62,0,0.05)}
        .plan-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
        .plan-day{font-family:'Bebas Neue',sans-serif;font-size:1rem;letter-spacing:2px}
        .plan-edit{padding:3px 8px;background:var(--bg);border:1px solid var(--border);border-radius:4px;color:var(--text2);font-size:0.6rem;cursor:pointer}
        .plan-name{font-weight:600;font-size:0.85rem}
        .plan-meta{font-size:0.65rem;color:var(--text3)}
        .prog-filters{display:flex;gap:4px;margin-bottom:12px;overflow-x:auto}
        .prog-filter{padding:5px 12px;background:var(--card);border:1px solid var(--border);border-radius:16px;color:var(--text2);font-size:0.65rem;cursor:pointer;white-space:nowrap}
        .prog-filter.active{background:var(--accent);border-color:var(--accent);color:#fff}
        .prog-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px}
        .prog-top{display:flex;justify-content:space-between;margin-bottom:12px}
        .prog-name{font-weight:600}
        .prog-pr{background:var(--fire);padding:3px 8px;border-radius:4px;font-size:0.65rem}
        .prog-chart{height:70px;display:flex;align-items:flex-end;gap:4px;margin-bottom:10px}
        .prog-bar-wrap{flex:1;display:flex;flex-direction:column;align-items:center}
        .prog-bar{width:100%;background:var(--fire);border-radius:3px 3px 0 0;min-height:5px;position:relative}
        .prog-bar-val{position:absolute;top:-14px;left:50%;transform:translateX(-50%);font-size:0.5rem;color:var(--accent);white-space:nowrap}
        .prog-bar-date{font-size:0.45rem;color:var(--text3);margin-top:2px}
        .prog-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding-top:10px;border-top:1px solid var(--border)}
        .prog-stat{text-align:center}
        .prog-stat-val{font-family:'Bebas Neue',sans-serif;font-size:1.2rem;color:var(--accent)}
        .prog-stat-lbl{font-size:0.5rem;color:var(--text3)}
        .hist-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:6px;cursor:pointer}
        .hist-date{font-size:0.6rem;color:var(--text3)}
        .hist-title{font-weight:600;margin:3px 0 6px}
        .hist-stats{font-size:0.7rem;color:var(--text2)}
        .hist-stats span{color:var(--accent);font-weight:600}
        .gym-overlay{display:none;position:fixed;inset:0;background:var(--bg);z-index:100;flex-direction:column}
        .gym-overlay.active{display:flex}
        .gym-head{display:flex;justify-content:space-between;align-items:center;padding:12px;background:var(--card);border-bottom:1px solid var(--border)}
        .gym-close{width:36px;height:36px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text2);font-size:1.1rem;cursor:pointer;display:flex;align-items:center;justify-content:center}
        .gym-dots{display:flex;gap:3px}
        .gym-dot{width:5px;height:5px;border-radius:50%;background:var(--border)}
        .gym-dot.done{background:var(--success)}
        .gym-dot.now{background:var(--accent);animation:pulse 1s infinite}
        @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.5)}}
        .gym-timer{font-family:'Bebas Neue',sans-serif;font-size:1.1rem;color:var(--accent)}
        .gym-body{flex:1;display:flex;flex-direction:column;padding:16px;overflow-y:auto;align-items:center}
        .gym-media{width:120px;height:120px;background:var(--card);border-radius:16px;margin-bottom:16px;overflow:hidden;display:flex;align-items:center;justify-content:center}
        .gym-media img,.gym-media video{width:100%;height:100%;object-fit:cover}
        .gym-media svg{width:60px;height:60px;stroke:var(--text3);fill:none}
        .gym-name{font-family:'Bebas Neue',sans-serif;font-size:1.8rem;letter-spacing:2px;text-align:center}
        .gym-target{color:var(--text2);margin-bottom:16px;text-align:center}
        .gym-note{color:var(--text2);font-size:0.8rem;padding:8px;background:var(--card);border-radius:8px;margin-bottom:16px;text-align:center;max-width:280px}
        .gym-sets{display:flex;justify-content:center;gap:8px;margin-bottom:16px;flex-wrap:wrap}
        .gym-set{width:55px;height:55px;background:var(--card);border:2px solid var(--border);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center}
        .gym-set.now{border-color:var(--accent);box-shadow:0 0 15px var(--glow)}
        .gym-set.done{border-color:var(--success);background:rgba(0,255,136,0.1)}
        .gym-set-num{font-size:0.55rem;color:var(--text3)}
        .gym-set-data{font-family:'JetBrains Mono',monospace;font-size:0.8rem;font-weight:600}
        .gym-inputs{background:var(--card);border-radius:14px;padding:16px;width:100%;max-width:300px}
        .gym-input-row{display:flex;gap:16px;justify-content:center;margin-bottom:12px}
        .gym-input-grp{text-align:center}
        .gym-input-lbl{font-size:0.65rem;color:var(--text3);margin-bottom:4px;text-transform:uppercase}
        .gym-input{width:90px;padding:14px;background:var(--bg);border:2px solid var(--border);border-radius:10px;color:var(--text);font-family:'Bebas Neue',sans-serif;font-size:1.8rem;text-align:center}
        .gym-input:focus{outline:0;border-color:var(--accent)}
        .gym-last{text-align:center;font-size:0.8rem;color:var(--success)}
        .gym-foot{padding:12px;background:var(--card);border-top:1px solid var(--border);display:flex;gap:8px}
        .gym-act{flex:1;padding:14px;border:0;border-radius:10px;font-family:'Bebas Neue',sans-serif;font-size:1rem;letter-spacing:2px;cursor:pointer}
        .gym-skip{background:var(--bg);color:var(--text2);border:1px solid var(--border)}
        .gym-next{background:var(--fire);color:#fff}
        .gym-rest{display:none;position:absolute;inset:0;background:rgba(0,0,0,0.95);flex-direction:column;align-items:center;justify-content:center;z-index:10}
        .gym-rest.active{display:flex}
        .gym-rest-title{font-family:'Bebas Neue',sans-serif;font-size:1.2rem;letter-spacing:4px;color:var(--text2);margin-bottom:12px}
        .gym-rest-num{font-family:'Bebas Neue',sans-serif;font-size:7rem;background:var(--fire);-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1}
        .gym-rest-skip{margin-top:24px;padding:10px 24px;background:0;border:2px solid var(--border);border-radius:24px;color:var(--text2);cursor:pointer}
        .modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:200;align-items:flex-end;justify-content:center}
        .modal.active{display:flex}
        .modal-box{background:var(--card);border-radius:16px 16px 0 0;width:100%;max-width:500px;max-height:85vh;overflow-y:auto;animation:slideUp 0.3s}
        @keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
        .modal-head{display:flex;justify-content:space-between;align-items:center;padding:14px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--card);z-index:5}
        .modal-title{font-family:'Bebas Neue',sans-serif;font-size:1.2rem;letter-spacing:2px}
        .modal-close{width:32px;height:32px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text2);font-size:1.1rem;cursor:pointer;display:flex;align-items:center;justify-content:center}
        .modal-body{padding:14px}
        .modal-foot{padding:12px 14px;border-top:1px solid var(--border);display:flex;gap:8px}
        .modal-btn{flex:1;padding:12px;border:0;border-radius:8px;font-weight:600;cursor:pointer}
        .modal-cancel{background:var(--bg);color:var(--text2)}
        .modal-save{background:var(--fire);color:#fff}
        .form-group{margin-bottom:12px}
        .form-label{display:block;font-size:0.65rem;color:var(--text2);margin-bottom:4px;text-transform:uppercase;letter-spacing:1px}
        .form-input,.form-select,.form-textarea{width:100%;padding:10px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:inherit;font-size:0.85rem}
        .form-input:focus,.form-select:focus,.form-textarea:focus{outline:0;border-color:var(--accent)}
        .form-textarea{min-height:70px;resize:vertical}
        .form-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
        .form-media{width:100%;height:120px;background:var(--bg);border:2px dashed var(--border);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;overflow:hidden}
        .form-media:hover{border-color:var(--accent)}
        .form-media.has-media{border-style:solid}
        .form-media img,.form-media video{width:100%;height:100%;object-fit:cover}
        .form-media-ph{text-align:center;color:var(--text3)}
        .form-media-ph p{font-size:0.7rem}
        .edit-item{display:flex;gap:8px;align-items:center;padding:8px;background:var(--bg);border-radius:8px;margin-bottom:5px}
        .edit-drag{color:var(--text3);font-size:1rem;cursor:grab}
        .edit-info{flex:1}
        .edit-name{font-weight:600;font-size:0.8rem}
        .edit-meta{font-size:0.6rem;color:var(--text2)}
        .edit-del{width:28px;height:28px;background:0;border:1px solid var(--border);border-radius:5px;color:var(--text3);cursor:pointer;display:flex;align-items:center;justify-content:center}
        .edit-del:hover{border-color:#ff4444;color:#ff4444}
        .add-btn{display:flex;align-items:center;justify-content:center;width:100%;padding:10px;background:0;border:2px dashed var(--border);border-radius:8px;color:var(--text2);font-size:0.8rem;cursor:pointer;margin-top:6px}
        .add-btn:hover{border-color:var(--accent);color:var(--accent)}
        .video-modal{position:fixed;inset:0;background:rgba(0,0,0,0.95);z-index:300;display:none;align-items:center;justify-content:center;padding:20px}
        .video-modal.active{display:flex}
        .video-modal video,.video-modal img{max-width:100%;max-height:85vh;border-radius:10px}
        .video-modal-close{position:absolute;top:16px;right:16px;width:40px;height:40px;background:var(--card);border:0;border-radius:50%;color:#fff;font-size:1.3rem;cursor:pointer}
        /* Celebration Modal */
        .celebration{position:fixed;inset:0;background:rgba(0,0,0,0.92);z-index:400;display:none;align-items:center;justify-content:center;flex-direction:column}
        .celebration.active{display:flex}
        .celebration-icon{font-size:5rem;animation:celebBounce 0.6s infinite}
        @keyframes celebBounce{0%,100%{transform:scale(1) rotate(-5deg)}50%{transform:scale(1.2) rotate(5deg)}}
        .celebration-title{font-family:'Bebas Neue',sans-serif;font-size:2.2rem;letter-spacing:3px;margin-top:16px;background:var(--fire);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        .celebration-sub{color:var(--text2);margin-top:8px;font-size:0.9rem}
        .celebration-btn{margin-top:24px;padding:14px 40px;background:var(--fire);border:0;border-radius:12px;color:#fff;font-family:'Bebas Neue',sans-serif;font-size:1.2rem;letter-spacing:2px;cursor:pointer;box-shadow:0 4px 20px var(--glow)}
        .confetti{position:absolute;width:10px;height:10px;border-radius:2px;animation:confettiFall 3s linear forwards}
        @keyframes confettiFall{0%{transform:translateY(-100vh) rotate(0deg);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}
        /* Stats Avanzados */
        .stats-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px}
        .stats-card-title{font-family:'Bebas Neue',sans-serif;font-size:1rem;letter-spacing:1px;margin-bottom:10px;display:flex;align-items:center;gap:6px}
        .stats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
        .stats-box{background:var(--bg);border-radius:8px;padding:10px;text-align:center}
        .stats-box.accent{border:1px solid var(--accent)}
        .stats-box.success{border:1px solid var(--success)}
        .stats-box.purple{border:1px solid var(--purple)}
        .stats-box.info{border:1px solid var(--info)}
        .stats-box-val{font-family:'Bebas Neue',sans-serif;font-size:1.5rem}
        .stats-box.accent .stats-box-val{color:var(--accent)}
        .stats-box.success .stats-box-val{color:var(--success)}
        .stats-box.purple .stats-box-val{color:var(--purple)}
        .stats-box.info .stats-box-val{color:var(--info)}
        .stats-box-lbl{font-size:0.55rem;color:var(--text3);text-transform:uppercase}
        .pr-item{display:flex;justify-content:space-between;align-items:center;padding:8px;background:var(--bg);border-radius:6px;margin-bottom:4px}
        .pr-name{font-size:0.8rem;font-weight:600}
        .pr-val{font-family:'JetBrains Mono',monospace;font-size:0.85rem;color:var(--success);font-weight:600}
        .pr-detail{font-size:0.5rem;color:var(--text3)}
        .pie-container{display:flex;align-items:center;gap:14px;padding:8px 0}
        .pie-chart{width:80px;height:80px;border-radius:50%;flex-shrink:0}
        .pie-legend{flex:1;display:flex;flex-wrap:wrap;gap:4px 12px}
        .pie-legend-item{display:flex;align-items:center;gap:4px;font-size:0.65rem}
        .pie-legend-dot{width:10px;height:10px;border-radius:3px}
        /* Export Buttons */
        .export-btns{display:flex;gap:6px;margin-top:12px}
        .export-btn{flex:1;padding:10px;background:var(--card);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:0.75rem;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px}
        .export-btn:hover{border-color:var(--accent);color:var(--accent)}
        .export-btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
        /* Toast */
        .toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--card);border:1px solid var(--success);border-radius:12px;padding:12px 20px;display:flex;align-items:center;gap:8px;z-index:500;opacity:0;transition:all 0.3s}
        .toast.active{transform:translateX(-50%) translateY(0);opacity:1}
        .toast-icon{font-size:1.2rem}
        .toast-text{font-size:0.85rem}
        /* Badges */
        .badges-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
        .badge{background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:10px 4px;text-align:center;opacity:0.35;transition:all 0.3s}
        .badge.unlocked{opacity:1;border-color:var(--warn);background:rgba(255,170,0,0.1);animation:badgeUnlock 0.5s}
        @keyframes badgeUnlock{0%{transform:scale(0)}50%{transform:scale(1.2)}100%{transform:scale(1)}}
        .badge-icon{font-size:1.6rem;margin-bottom:4px}
        .badge-name{font-size:0.5rem;color:var(--text3);line-height:1.2}
        .badge.unlocked .badge-name{color:var(--warn)}
        /* Level & XP */
        .level-card{background:linear-gradient(135deg,#1a0a00,#2d1200);border:1px solid var(--accent);border-radius:12px;padding:14px;margin-bottom:12px;position:relative;overflow:hidden}
        .level-card::before{content:'⭐';position:absolute;font-size:5rem;opacity:0.05;right:-10px;top:-10px}
        .level-row{display:flex;align-items:center;gap:12px}
        .level-badge{width:55px;height:55px;background:var(--fire);border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:1.8rem;color:#fff;box-shadow:0 0 20px var(--glow)}
        .level-info{flex:1}
        .level-title{font-family:'Bebas Neue',sans-serif;font-size:1.1rem;letter-spacing:1px}
        .level-xp{font-size:0.7rem;color:var(--text2);margin:4px 0}
        .level-bar{height:8px;background:var(--border);border-radius:4px;overflow:hidden}
        .level-bar-fill{height:100%;background:var(--fire);border-radius:4px;transition:width 0.5s}
        /* Streak Fire */
        .streak-card{background:linear-gradient(135deg,#0a1a00,#1a2d00);border:1px solid var(--success);border-radius:12px;padding:14px;margin-bottom:12px;display:flex;align-items:center;gap:12px}
        .streak-fire{font-size:2.5rem;animation:fireAnim 0.5s infinite alternate}
        @keyframes fireAnim{0%{transform:scale(1) rotate(-3deg)}100%{transform:scale(1.1) rotate(3deg)}}
        .streak-info{flex:1}
        .streak-num{font-family:'Bebas Neue',sans-serif;font-size:2rem;color:var(--success);line-height:1}
        .streak-label{font-size:0.7rem;color:var(--text2)}
        .streak-best{font-size:0.6rem;color:var(--warn);margin-top:2px}
        /* Heatmap */
        .heatmap-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:12px}
        .heatmap{display:flex;flex-direction:column;gap:2px}
        .heatmap-row{display:flex;gap:2px}
        .heatmap-cell{width:14px;height:14px;border-radius:3px;background:var(--border);cursor:pointer;transition:transform 0.1s}
        .heatmap-cell:hover{transform:scale(1.3)}
        .heatmap-cell.l1{background:#1a4d1a}
        .heatmap-cell.l2{background:#2d7a2d}
        .heatmap-cell.l3{background:#40a640}
        .heatmap-cell.l4{background:var(--success)}
        .heatmap-cell.today{outline:2px solid var(--accent);outline-offset:1px}
        .heatmap-legend{display:flex;align-items:center;gap:4px;justify-content:flex-end;margin-top:8px;font-size:0.5rem;color:var(--text3)}
        .heatmap-legend-cell{width:12px;height:12px;border-radius:2px}
        .heatmap-months{display:flex;justify-content:space-between;margin-bottom:4px;font-size:0.5rem;color:var(--text3)}
        /* Timer grande */
        .timer-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px;text-align:center}
        .timer-display{font-family:'Bebas Neue',sans-serif;font-size:3rem;color:var(--accent);letter-spacing:4px}
        .timer-label{font-size:0.7rem;color:var(--text3)}
        .timer-btns{display:flex;gap:6px;margin-top:10px}
        .timer-btn{flex:1;padding:10px;border:0;border-radius:8px;font-weight:600;cursor:pointer;font-size:0.8rem}
        .timer-btn.start{background:var(--success);color:var(--bg)}
        .timer-btn.pause{background:var(--warn);color:var(--bg)}
        .timer-btn.reset{background:var(--card2);color:var(--text2);border:1px solid var(--border)}
        /* Predicción */
        .predict-card{background:var(--card);border:1px solid var(--purple);border-radius:12px;padding:12px;margin-bottom:12px}
        .predict-title{font-size:0.75rem;color:var(--purple);margin-bottom:8px;display:flex;align-items:center;gap:6px}
        .predict-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border)}
        .predict-row:last-child{border:0}
        .predict-name{font-size:0.8rem}
        .predict-val{font-family:'JetBrains Mono',monospace;color:var(--purple);font-weight:600}
        /* Control de Peso */
        .weight-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px}
        .weight-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
        .weight-current{text-align:center}
        .weight-big{font-family:'Bebas Neue',sans-serif;font-size:3rem;background:var(--fire);-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1}
        .weight-unit{font-size:1rem;color:var(--text2)}
        .weight-change{font-size:0.75rem;padding:4px 10px;border-radius:12px;font-weight:600}
        .weight-change.up{background:rgba(255,62,0,0.2);color:var(--accent)}
        .weight-change.down{background:rgba(0,255,136,0.2);color:var(--success)}
        .weight-change.same{background:rgba(255,255,255,0.1);color:var(--text2)}
        .weight-input-row{display:flex;gap:8px;margin-bottom:12px}
        .weight-input{flex:1;padding:12px;background:var(--bg);border:2px solid var(--border);border-radius:10px;color:var(--text);font-family:'JetBrains Mono',monospace;font-size:1.2rem;text-align:center}
        .weight-input:focus{outline:0;border-color:var(--accent)}
        .weight-btn{padding:12px 20px;background:var(--fire);border:0;border-radius:10px;color:#fff;font-weight:600;cursor:pointer}
        .weight-goal{display:flex;align-items:center;gap:10px;padding:10px;background:var(--bg);border-radius:8px;margin-bottom:12px}
        .weight-goal-icon{font-size:1.5rem}
        .weight-goal-info{flex:1}
        .weight-goal-label{font-size:0.65rem;color:var(--text3)}
        .weight-goal-val{font-family:'JetBrains Mono',monospace;font-weight:600}
        .weight-goal-diff{font-size:0.7rem}
        .weight-goal-diff.positive{color:var(--success)}
        .weight-goal-diff.negative{color:var(--accent)}
        /* Gráfica de peso */
        .weight-chart{height:120px;background:var(--bg);border-radius:8px;padding:10px;position:relative;margin-bottom:12px}
        .weight-chart-bars{display:flex;align-items:flex-end;justify-content:space-between;height:100%;gap:3px}
        .weight-chart-bar{flex:1;background:var(--accent);border-radius:3px 3px 0 0;min-height:4px;position:relative;cursor:pointer;transition:opacity 0.2s}
        .weight-chart-bar:hover{opacity:0.8}
        .weight-chart-bar::after{content:attr(data-val);position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font-size:0.5rem;color:var(--text3);opacity:0;transition:opacity 0.2s;white-space:nowrap}
        .weight-chart-bar:hover::after{opacity:1}
        .weight-chart-labels{display:flex;justify-content:space-between;margin-top:4px}
        .weight-chart-label{font-size:0.5rem;color:var(--text3)}
        /* Medidas Corporales */
        .measures-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
        .measure-box{background:var(--bg);border-radius:10px;padding:12px;text-align:center;border:1px solid var(--border);cursor:pointer;transition:all 0.2s}
        .measure-box:hover{border-color:var(--accent)}
        .measure-box.active{border-color:var(--accent);background:rgba(255,62,0,0.05)}
        .measure-icon{font-size:1.5rem;margin-bottom:4px}
        .measure-name{font-size:0.65rem;color:var(--text3);margin-bottom:4px}
        .measure-val{font-family:'Bebas Neue',sans-serif;font-size:1.4rem}
        .measure-val span{font-size:0.8rem;color:var(--text2)}
        .measure-change{font-size:0.6rem;margin-top:2px}
        .measure-change.up{color:var(--accent)}
        .measure-change.down{color:var(--success)}
        .measure-input-modal{position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:300;display:none;align-items:center;justify-content:center}
        .measure-input-modal.active{display:flex}
        .measure-input-box{background:var(--card);border-radius:16px;padding:20px;width:90%;max-width:300px;text-align:center}
        .measure-input-title{font-family:'Bebas Neue',sans-serif;font-size:1.3rem;margin-bottom:4px}
        .measure-input-icon{font-size:2.5rem;margin-bottom:10px}
        .measure-input-field{width:100%;padding:14px;background:var(--bg);border:2px solid var(--border);border-radius:10px;color:var(--text);font-family:'JetBrains Mono',monospace;font-size:1.5rem;text-align:center;margin-bottom:12px}
        .measure-input-field:focus{outline:0;border-color:var(--accent)}
        .measure-input-btns{display:flex;gap:8px}
        .measure-input-btn{flex:1;padding:12px;border:0;border-radius:8px;font-weight:600;cursor:pointer}
        .measure-input-btn.cancel{background:var(--bg);color:var(--text2)}
        .measure-input-btn.save{background:var(--fire);color:#fff}
        /* Historial de peso */
        .weight-history{max-height:200px;overflow-y:auto}
        .weight-history-item{display:flex;justify-content:space-between;align-items:center;padding:8px;background:var(--bg);border-radius:6px;margin-bottom:4px}
        .weight-history-date{font-size:0.7rem;color:var(--text2)}
        .weight-history-val{font-family:'JetBrains Mono',monospace;font-weight:600}
        .weight-history-diff{font-size:0.65rem;padding:2px 6px;border-radius:8px}
        /* Cloud Sync */
        .sync-card{background:linear-gradient(135deg,#001a1a,#002d2d);border:1px solid var(--info);border-radius:12px;padding:14px;margin-bottom:12px}
        .sync-header{display:flex;align-items:center;gap:10px;margin-bottom:12px}
        .sync-icon{font-size:2rem}
        .sync-title{font-family:'Bebas Neue',sans-serif;font-size:1.1rem;letter-spacing:1px}
        .sync-status{font-size:0.7rem;color:var(--text2)}
        .sync-status.online{color:var(--success)}
        .sync-status.offline{color:var(--accent)}
        .sync-input{width:100%;padding:10px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:'JetBrains Mono',monospace;font-size:0.7rem;margin-bottom:10px}
        .sync-input:focus{outline:0;border-color:var(--info)}
        .sync-btns{display:flex;gap:6px}
        .sync-btn{flex:1;padding:10px;border:0;border-radius:8px;font-weight:600;cursor:pointer;font-size:0.75rem}
        .sync-btn.connect{background:var(--info);color:var(--bg)}
        .sync-btn.sync{background:var(--success);color:var(--bg)}
        .sync-btn.disconnect{background:var(--card2);color:var(--text2);border:1px solid var(--border)}
        .sync-last{font-size:0.6rem;color:var(--text3);text-align:center;margin-top:8px}
        .sync-indicator{position:fixed;top:10px;right:10px;width:12px;height:12px;border-radius:50%;background:var(--text3);z-index:100}
        .sync-indicator.online{background:var(--success);box-shadow:0 0 10px var(--success)}
        .sync-indicator.syncing{background:var(--info);animation:syncPulse 1s infinite}
        @keyframes syncPulse{0%,100%{opacity:1}50%{opacity:0.3}}
        /* Plan Editor Mejorado */
        .plan-day-card{background:var(--card);border:1px solid var(--border);border-radius:12px;margin-bottom:10px;overflow:hidden}
        .plan-day-card.today{border-color:var(--accent)}
        .plan-day-card.rest{opacity:0.7}
        .plan-day-header{display:flex;align-items:center;gap:10px;padding:12px;background:var(--card2);cursor:pointer}
        .plan-day-card.today .plan-day-header{background:rgba(255,62,0,0.1)}
        .plan-day-icon{font-size:1.5rem}
        .plan-day-info{flex:1}
        .plan-day-name{font-family:'Bebas Neue',sans-serif;font-size:1.1rem;letter-spacing:1px}
        .plan-day-sub{font-size:0.65rem;color:var(--text2)}
        .plan-day-toggle{width:30px;height:30px;background:var(--bg);border:1px solid var(--border);border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--text2);font-size:0.8rem;cursor:pointer;transition:transform 0.2s}
        .plan-day-toggle.open{transform:rotate(180deg)}
        .plan-day-content{display:none;padding:12px;border-top:1px solid var(--border)}
        .plan-day-content.open{display:block}
        .plan-edit-row{display:flex;gap:8px;margin-bottom:12px}
        .plan-edit-input{flex:1;padding:10px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:0.85rem}
        .plan-edit-input:focus{outline:0;border-color:var(--accent)}
        .plan-edit-input.icon{width:60px;flex:none;text-align:center;font-size:1.2rem}
        .plan-section{margin-bottom:12px}
        .plan-section-title{font-size:0.65rem;color:var(--text3);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;display:flex;align-items:center;justify-content:space-between}
        .plan-section-add{padding:4px 8px;background:var(--accent);border:0;border-radius:4px;color:#fff;font-size:0.6rem;cursor:pointer}
        .plan-ex-item{display:flex;align-items:center;gap:8px;padding:8px;background:var(--bg);border-radius:6px;margin-bottom:4px}
        .plan-ex-item.warmup{border-left:3px solid var(--warn)}
        .plan-ex-item.main{border-left:3px solid var(--accent)}
        .plan-ex-item.accessory{border-left:3px solid var(--purple)}
        .plan-ex-item.cardio{border-left:3px solid var(--info)}
        .plan-ex-drag{color:var(--text3);cursor:grab;font-size:1rem}
        .plan-ex-info{flex:1}
        .plan-ex-name{font-size:0.8rem;font-weight:600}
        .plan-ex-meta{font-size:0.6rem;color:var(--text2)}
        .plan-ex-del{width:28px;height:28px;background:0;border:1px solid var(--border);border-radius:4px;color:var(--text3);cursor:pointer;font-size:0.8rem}
        .plan-ex-del:hover{border-color:var(--accent);color:var(--accent)}
        .plan-empty{padding:12px;text-align:center;color:var(--text3);font-size:0.75rem;background:var(--bg);border-radius:6px;border:2px dashed var(--border)}
        .plan-rest-toggle{display:flex;align-items:center;justify-content:space-between;padding:10px;background:var(--bg);border-radius:8px;margin-bottom:12px}
        .plan-rest-label{font-size:0.8rem}
        .plan-rest-switch{width:50px;height:28px;background:var(--border);border-radius:14px;position:relative;cursor:pointer;transition:background 0.2s}
        .plan-rest-switch.on{background:var(--success)}
        .plan-rest-switch::after{content:'';position:absolute;width:22px;height:22px;background:#fff;border-radius:50%;top:3px;left:3px;transition:left 0.2s}
        .plan-rest-switch.on::after{left:25px}
        .plan-save-btn{width:100%;padding:12px;background:var(--fire);border:0;border-radius:8px;color:#fff;font-family:'Bebas Neue',sans-serif;font-size:1rem;letter-spacing:2px;cursor:pointer;margin-top:8px}
        /* Historial */
        .hist-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px;cursor:pointer;transition:border-color 0.2s}
        .hist-card:hover{border-color:var(--accent)}
        .hist-card-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
        .hist-card-date{font-size:0.7rem;color:var(--text2)}
        .hist-card-day{font-family:'Bebas Neue',sans-serif;font-size:1.2rem;color:var(--accent)}
        .hist-card-badge{padding:4px 8px;background:var(--success);color:var(--bg);font-size:0.6rem;font-weight:600;border-radius:4px}
        .hist-card-title{font-family:'Bebas Neue',sans-serif;font-size:1rem;letter-spacing:1px;margin-bottom:6px}
        .hist-card-stats{display:flex;gap:12px;font-size:0.75rem;color:var(--text2)}
        .hist-card-stat{display:flex;align-items:center;gap:4px}
        .hist-card-stat span{color:var(--text);font-weight:600}
        .hist-detail-modal{position:fixed;inset:0;background:rgba(0,0,0,0.9);z-index:200;display:none;overflow-y:auto}
        .hist-detail-modal.active{display:block}
        .hist-detail-content{padding:20px;max-width:500px;margin:0 auto}
        .hist-detail-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
        .hist-detail-title{font-family:'Bebas Neue',sans-serif;font-size:1.5rem}
        .hist-detail-close{width:36px;height:36px;background:var(--card);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:1.2rem;cursor:pointer}
        .hist-detail-meta{font-size:0.75rem;color:var(--text2);margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--border)}
        .hist-ex-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:8px}
        .hist-ex-card.warmup{border-left:3px solid var(--warn)}
        .hist-ex-card.main{border-left:3px solid var(--accent)}
        .hist-ex-card.accessory{border-left:3px solid var(--purple)}
        .hist-ex-card.cardio{border-left:3px solid var(--info)}
        .hist-ex-name{font-weight:600;font-size:0.9rem;margin-bottom:6px;display:flex;align-items:center;gap:6px}
        .hist-ex-name .done{color:var(--success)}
        .hist-ex-name .skip{color:var(--text3)}
        .hist-ex-sets{display:flex;flex-wrap:wrap;gap:6px}
        .hist-ex-set{padding:6px 10px;background:var(--bg);border-radius:6px;font-family:'JetBrains Mono',monospace;font-size:0.75rem}
        .hist-ex-set.best{background:rgba(255,170,0,0.2);color:var(--warn)}
        .hist-notes{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px;margin-top:12px}
        .hist-notes-title{font-size:0.65rem;color:var(--text3);text-transform:uppercase;margin-bottom:6px}
        .hist-empty{text-align:center;padding:40px 20px;color:var(--text3)}
        .hist-empty-icon{font-size:3rem;margin-bottom:10px}
        .hist-filters{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;padding-bottom:6px}
        .hist-filter{padding:8px 14px;background:var(--card);border:1px solid var(--border);border-radius:8px;color:var(--text2);font-size:0.75rem;white-space:nowrap;cursor:pointer}
        .hist-filter.active{background:var(--accent);border-color:var(--accent);color:#fff}
    </style>
</head>
<body>
<div class="app">
    <div class="sync-indicator" id="sync-indicator" title="Estado de sincronización"></div>
    <header class="header"><h1 class="logo">GYM PRO</h1></header>
    <nav class="nav">

{id:23,name:'Plancha',cat:'core',type:'main',sets:3,reps:'30-45s',notes:'Cuerpo recto',media:'https://media.musclewiki.com/media/uploads/videos/branded/male-bodyweight-front-plank-side.mp4'},

{id:27,name:'Bici Estática',cat:'cardio',type:'warmup',sets:1,reps:'5-10 min',notes:'Calentar',media:''},
{id:28,name:'Cinta',cat:'cardio',type:'cardio',sets:1,reps:'15-20 min',notes:'Moderado',media:''},
{id:29,name:'Elíptica',cat:'cardio',type:'cardio',sets:1,reps:'15-20 min',notes:'Bajo impacto',media:''},
{id:30,name:'Remo Ergómetro',cat:'cardio',type:'warmup',sets:1,reps:'5 min',notes:'Calentamiento',media:''},
{id:31,name:'Rotación Externa',cat:'movilidad',type:'warmup',sets:2,reps:'15',notes:'Rehabilitación hombro',media:''},
{id:32,name:'Puente Glúteos',cat:'movilidad',type:'warmup',sets:2,reps:'15',notes:'Activación',media:'https://media.musclewiki.com/media/uploads/videos/branded/male-bodyweight-glute-bridge-side.mp4'},
];

const DEF_PLAN={
1:{name:'PIERNA + CORE',icon:'🦵',warmup:[27,31,32],exercises:[1,2,5,4],accessory:[6],cardio:[]},
2:{name:'TORSO PUSH',icon:'💪',warmup:[30,31],exercises:[8,9,16],accessory:[17,21],cardio:[]},
3:{name:'ESPALDA + BICEPS',icon:'🔙',warmup:[30,31],exercises:[12,13,14,15],accessory:[19,20],cardio:[]},
4:{name:'PIERNA FUERTE',icon:'🏋️',warmup:[27,31,32],exercises:[3,5,4],accessory:[6,7],cardio:[28]},
5:{name:'FULL BODY',icon:'⚡',warmup:[27,31],exercises:[1,12,8,23],accessory:[17,19],cardio:[]},
6:{name:'CARDIO + CORE',icon:'🔥',warmup:[27],exercises:[23,24,26],accessory:[25],cardio:[28,29]},
0:{name:'DESCANSO',icon:'😴',rest:true}
};

let LIB=JSON.parse(localStorage.getItem('glib5'))||JSON.parse(JSON.stringify(DEF_LIB));
let PLAN=JSON.parse(localStorage.getItem('gplan5'))||JSON.parse(JSON.stringify(DEF_PLAN));
let DATA=JSON.parse(localStorage.getItem('gdata5'))||{history:[],current:null,weekDone:{},settings:{rest:90}};
if(!DATA.weekDone)DATA.weekDone={};if(!DATA.history)DATA.history=[];if(!DATA.settings)DATA.settings={rest:90};

let GYM={on:false,exs:[],i:0,s:0,start:null,timer:null,restTimer:null};
let editingDay=null,editingEx=null,addingEx=null,pickingFor=null;

function save(){localStorage.setItem('glib5',JSON.stringify(LIB));localStorage.setItem('gplan5',JSON.stringify(PLAN));localStorage.setItem('gdata5',JSON.stringify(DATA));}
const dayNames=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'],dayShort=['D','L','M','X','J','V','S'];
function fmtDate(d){return d.toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'});}
function todayKey(){const d=new Date();return d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate();}
function weekKey(){const d=new Date();d.setDate(d.getDate()-d.getDay()+1);return d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate();}
function getEx(id){return LIB.find(function(e){return e.id===id;});}
function getLast(name){for(let i=DATA.history.length-1;i>=0;i--){const h=DATA.history[i];if(h.exercises){const e=h.exercises.find(function(x){return x.name===name;});if(e&&e.sets){const s=e.sets.find(function(x){return x.weight>0;});if(s)return{w:s.weight,r:s.reps};}}}return null;}

function renderWeek(){
    const wk=weekKey();if(!DATA.weekDone[wk])DATA.weekDone[wk]={};
    const today=new Date().getDay();let done=0,total=0,html='';
    [1,2,3,4,5,6,0].forEach(function(d){
        const p=PLAN[d];if(!p)return;
        const isDone=DATA.weekDone[wk]&&DATA.weekDone[wk][d];
        const isRest=p.rest;
        if(!isRest)total++;if(isDone)done++;
        let cls='week-day-circle';
        if(isDone)cls+=' done';else if(d===today)cls+=' today';
        if(isRest)cls+=' rest';
        html+='<div class="week-day"><div class="week-day-name">'+dayShort[d]+'</div><div class="'+cls+'" onclick="toggleWeekDay('+d+')">'+(isDone?'✓':isRest?'—':d===today?'•':'')+'</div></div>';
    });
    document.getElementById('week-days').innerHTML=html;
    const pct=total?Math.round(done/total*100):0;
    document.getElementById('week-pct').textContent=pct+'%';
    document.getElementById('week-fill').style.width=pct+'%';
}
function toggleWeekDay(d){const wk=weekKey();if(!DATA.weekDone[wk])DATA.weekDone[wk]={};DATA.weekDone[wk][d]=!DATA.weekDone[wk][d];save();renderWeek();updateStats();}

function updateStats(){
    let streak=0;const now=new Date();now.setHours(0,0,0,0);
    for(let i=0;i<365;i++){
        const d=new Date(now);d.setDate(d.getDate()-i);
        const k=d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate();
        const has=DATA.history.some(function(h){return h.date===k;});
        const rest=PLAN[d.getDay()]&&PLAN[d.getDay()].rest;
        if(has||rest){if(!rest)streak++;}else if(i>0)break;
    }
    const ws=new Date(now);ws.setDate(ws.getDate()-ws.getDay()+1);
    const week=DATA.history.filter(function(h){const p=h.date.split('-');return new Date(+p[0],+p[1],+p[2])>=ws;}).length;
    document.getElementById('s-streak').textContent=streak;
    document.getElementById('s-week').textContent=week;
    document.getElementById('s-total').textContent=DATA.history.length;
}

function renderToday(){
    const d=new Date(),dn=d.getDay(),p=PLAN[dn]||{rest:true};
    document.getElementById('t-date').textContent=fmtDate(d);
    document.getElementById('t-day').textContent=dayNames[dn].toUpperCase();
    document.getElementById('t-badge').innerHTML=(p.icon||'💪')+' '+(p.name||'');
    const box=document.getElementById('workout-box'),gymBtn=document.getElementById('gym-start');
    if(p.rest){box.innerHTML='<div class="rest"><div class="rest-emoji">😴</div><div class="rest-title">DÍA DE DESCANSO</div></div>';gymBtn.style.display='none';renderWeek();updateStats();return;}
    gymBtn.style.display='flex';
    const allEx=[];
    ['warmup','exercises','accessory','cardio'].forEach(function(type){
        if(Array.isArray(p[type]))p[type].forEach(function(id){
            const e=getEx(id);if(e)allEx.push(Object.assign({},e,{exType:type==='exercises'?'main':type}));
        });
    });
    if(!allEx.length){box.innerHTML='<div class="empty"><div class="empty-icon">📋</div><p>No hay ejercicios</p><button class="empty-btn" onclick="document.querySelector(\'[data-tab=plan]\').click()">Ir al Plan</button></div>';renderWeek();updateStats();return;}
    const key=todayKey();
    if(!DATA.current||DATA.current.date!==key){
        DATA.current={date:key,dayName:dayNames[dn],planName:p.name,exercises:allEx.map(function(e){return{name:e.name,cat:e.cat,type:e.exType,completed:false,sets:Array(e.sets||3).fill().map(function(){return{weight:'',reps:''};})};})};
        save();
    }
    let html='',groups={warmup:[],main:[],accessory:[],cardio:[]};
    allEx.forEach(function(e,i){if(groups[e.exType])groups[e.exType].push({ex:e,idx:i});});
    if(groups.warmup.length){html+='<div class="sec-title">🔥 Calentamiento</div>';groups.warmup.forEach(function(o){html+=exCard(o.ex,o.idx);});}

function exCard(ex,idx){
    const curr=DATA.current&&DATA.current.exercises&&DATA.current.exercises[idx];
    const done=curr&&curr.completed,last=getLast(ex.name);
    let media=ex.media?(isVideo(ex.media)?'<video src="'+ex.media+'" muted></video>':'<img src="'+ex.media+'">'):getIcon();
    let sets='';
    if((ex.exType==='main'||ex.exType==='accessory')&&curr&&curr.sets){
        sets='<div class="ex-sets">'+curr.sets.map(function(s,si){
            return '<div class="set-box"><div class="set-label">S'+(si+1)+'</div><div class="set-inputs"><input type="number" class="set-input" placeholder="kg" value="'+(s.weight||'')+'" data-ex="'+idx+'" data-set="'+si+'" data-t="weight" onchange="updSet(this)"><span class="set-x">×</span><input type="number" class="set-input" placeholder="r" value="'+(s.reps||'')+'" data-ex="'+idx+'" data-set="'+si+'" data-t="reps" onchange="updSet(this)"></div>'+(si===0&&last?'<div class="set-last">'+last.w+'×'+last.r+'</div>':'')+'</div>';
        }).join('')+'</div>';
    }
    return '<div class="ex-card '+ex.exType+(done?' done':'')+'"><div class="ex-top"><div class="ex-media" onclick="openMedia(\''+((ex.media||'').replace(/'/g,"\\'"))+'\')">'+media+'</div><div class="ex-info"><div class="ex-name">'+ex.name+'</div><div class="ex-meta">'+ex.sets+'×'+ex.reps+' · '+ex.cat+'</div></div></div>'+(ex.notes?'<div class="ex-notes">'+ex.notes+'</div>':'')+sets+'<button class="done-btn'+(done?' checked':'')+'" onclick="toggleDone('+idx+')">'+(done?'✓ Hecho':'○ Completar')+'</button></div>';
}

function updSet(el){
    const ex=+el.dataset.ex,set=+el.dataset.set,t=el.dataset.t;
    if(DATA.current&&DATA.current.exercises&&DATA.current.exercises[ex]&&DATA.current.exercises[ex].sets&&DATA.current.exercises[ex].sets[set]){
        DATA.current.exercises[ex].sets[set][t]=el.value?parseFloat(el.value):'';save();
    }
}
function toggleDone(idx){
    if(!DATA.current||!DATA.current.exercises||!DATA.current.exercises[idx])return;
    DATA.current.exercises[idx].completed=!DATA.current.exercises[idx].completed;save();
    if(DATA.current.exercises.every(function(e){return e.completed;}))finishWorkout();else renderToday();
}
function finishWorkout(){
    const i=DATA.history.findIndex(function(h){return h.date===DATA.current.date;});
    if(i>=0)DATA.history[i]=Object.assign({},DATA.current);else DATA.history.push(Object.assign({},DATA.current));
    const wk=weekKey(),dn=new Date().getDay();
    if(!DATA.weekDone[wk])DATA.weekDone[wk]={};DATA.weekDone[wk][dn]=true;
    // Calcular volumen y XP
    var vol = 0, exCount = 0;
    if(DATA.current.exercises) DATA.current.exercises.forEach(function(e){
        if(e.completed) exCount++;
        if(e.sets) e.sets.forEach(function(s){ if(s.weight>0&&s.reps>0) vol += s.weight*s.reps; });
    });
    save();
    addXP(50 + exCount * 5, 'Entreno completado');
    renderToday();
    showCelebration('🎉', '¡ENTRENO COMPLETADO!', Math.round(vol/1000) + 'K kg · +' + (50 + exCount * 5) + ' XP');
}

    // No añadir duplicados
    if (PLAN[pickingDay][pickingType].indexOf(exId) === -1) {

function renderProgress(){
    const exData={};

    });
    const names=Object.keys(exData);

function showProgress(name,btn){
    document.querySelectorAll('.prog-filter').forEach(function(b){b.classList.remove('active');});
    if(btn)btn.classList.add('active');
    const exData={};
    DATA.history.forEach(function(h){if(h.exercises)h.exercises.forEach(function(e){if(e.name===name&&e.sets){e.sets.forEach(function(s){if(s.weight>0){if(!exData[name])exData[name]=[];exData[name].push({date:h.date,w:s.weight,r:s.reps||0});}});}});});
    const data=exData[name]||[];
    if(!data.length){document.getElementById('prog-box').innerHTML='<p style="text-align:center;color:var(--text3)">Sin datos</p>';return;}
    const maxW=Math.max.apply(null,data.map(function(d){return d.w;})),minW=Math.min.apply(null,data.map(function(d){return d.w;})),last8=data.slice(-8),avgR=Math.round(data.reduce(function(a,b){return a+b.r;},0)/data.length);
    document.getElementById('prog-box').innerHTML='<div class="prog-card"><div class="prog-top"><span class="prog-name">'+name+'</span><span class="prog-pr">PR: '+maxW+'kg</span></div><div class="prog-chart">'+last8.map(function(d){const h=((d.w-minW+5)/(maxW-minW+10))*100;const p=d.date.split('-');return '<div class="prog-bar-wrap"><div class="prog-bar" style="height:'+Math.max(h,15)+'%"><span class="prog-bar-val">'+d.w+'×'+d.r+'</span></div><span class="prog-bar-date">'+p[2]+'/'+(+p[1]+1)+'</span></div>';}).join('')+'</div><div class="prog-stats"><div class="prog-stat"><div class="prog-stat-val">'+data[0].w+'kg</div><div class="prog-stat-lbl">Inicial</div></div><div class="prog-stat"><div class="prog-stat-val">'+data[data.length-1].w+'kg</div><div class="prog-stat-lbl">Actual</div></div><div class="prog-stat"><div class="prog-stat-val">'+avgR+'</div><div class="prog-stat-lbl">Avg Reps</div></div></div></div>';
}

function renderHistory(){
    if(!DATA.history.length){document.getElementById('hist-box').innerHTML='<div class="empty"><div class="empty-icon">📜</div><p>Sin entrenamientos</p></div>';return;}
    document.getElementById('hist-box').innerHTML=DATA.history.slice().reverse().map(function(h,i){
        const exC=h.exercises?h.exercises.filter(function(e){return e.completed;}).length:0;
        const vol=h.exercises?h.exercises.reduce(function(a,e){return a+(e.sets?e.sets.reduce(function(sa,s){return sa+((s.weight||0)*(s.reps||0));},0):0);},0):0;
        return '<div class="hist-card" onclick="openHistModal('+(DATA.history.length-1-i)+')"><div class="hist-date">'+h.dayName+' · '+h.date+'</div><div class="hist-title">'+h.planName+'</div><div class="hist-stats"><span>'+exC+'</span> ejercicios · <span>'+Math.round(vol/1000)+'k</span> kg</div></div>';
    }).join('');
}
function openHistModal(idx){
    const h=DATA.history[idx];document.getElementById('hist-modal-title').textContent=h.planName;
    let html='<p style="color:var(--text3);margin-bottom:10px">'+h.dayName+' · '+h.date+'</p>';
    if(h.exercises)h.exercises.forEach(function(e){
        if((e.type==='main'||e.type==='accessory')&&e.sets){
            const str=e.sets.map(function(s,i){return s.weight?'S'+(i+1)+': '+s.weight+'kg×'+s.reps:null;}).filter(Boolean).join(' | ');
            if(str)html+='<div style="padding:8px;background:var(--bg);border-radius:6px;margin-bottom:4px"><div style="font-weight:600;font-size:0.85rem">'+e.name+'</div><div style="font-size:0.7rem;color:var(--text2)">'+str+'</div></div>';
        }
    });
    if(h.notes)html+='<div style="margin-top:10px;padding:8px;background:var(--bg);border-radius:6px"><div style="font-size:0.6rem;color:var(--text3)">NOTAS</div><div>'+h.notes+'</div></div>';
    document.getElementById('hist-modal-body').innerHTML=html;
    document.getElementById('hist-modal').classList.add('active');
}
function closeHistModal(){document.getElementById('hist-modal').classList.remove('active');}

function startGym(){
    const dn=new Date().getDay(),p=PLAN[dn];if(!p||p.rest)return;
    const allEx=[];['warmup','exercises','accessory','cardio'].forEach(function(type){if(Array.isArray(p[type]))p[type].forEach(function(id){const e=getEx(id);if(e)allEx.push(Object.assign({},e,{exType:type==='exercises'?'main':type}));});});
    if(!allEx.length){alert('No hay ejercicios');return;}
    GYM={on:true,exs:allEx,i:0,s:0,start:Date.now(),timer:null,restTimer:null};
    document.getElementById('gym-overlay').classList.add('active');document.body.style.overflow='hidden';
    GYM.timer=setInterval(updateGymTimer,1000);renderGymEx();
}
function closeGym(){GYM.on=false;if(GYM.timer)clearInterval(GYM.timer);if(GYM.restTimer)clearInterval(GYM.restTimer);document.getElementById('gym-overlay').classList.remove('active');document.body.style.overflow='';renderToday();}
function updateGymTimer(){const secs=Math.floor((Date.now()-GYM.start)/1000);document.getElementById('gym-timer').textContent=String(Math.floor(secs/60)).padStart(2,'0')+':'+String(secs%60).padStart(2,'0');}

function renderGymEx(){
    const ex=GYM.exs[GYM.i];if(!ex){closeGym();finishWorkout();return;}
    document.getElementById('gym-dots').innerHTML=GYM.exs.map(function(_,i){return '<div class="gym-dot'+(i<GYM.i?' done':i===GYM.i?' now':'')+'"></div>';}).join('');
    const curr=DATA.current&&DATA.current.exercises&&DATA.current.exercises[GYM.i],last=getLast(ex.name);
    let media=ex.media?(isVideo(ex.media)?'<video src="'+ex.media+'" autoplay muted loop></video>':'<img src="'+ex.media+'">'):getIcon();
    let setsHtml='';
    if((ex.exType==='main'||ex.exType==='accessory')&&curr&&curr.sets){setsHtml='<div class="gym-sets">'+curr.sets.map(function(s,i){return '<div class="gym-set'+(i<GYM.s?' done':i===GYM.s?' now':'')+'"><span class="gym-set-num">S'+(i+1)+'</span><span class="gym-set-data">'+(s.weight||'-')+'×'+(s.reps||'-')+'</span></div>';}).join('')+'</div>';}
    let inputsHtml='';
    if(ex.exType==='main'||ex.exType==='accessory'){inputsHtml='<div class="gym-inputs"><div class="gym-input-row"><div class="gym-input-grp"><div class="gym-input-lbl">Peso (kg)</div><input type="number" class="gym-input" id="gym-w" value="'+(curr&&curr.sets&&curr.sets[GYM.s]?curr.sets[GYM.s].weight||'':'')+'"></div><div class="gym-input-grp"><div class="gym-input-lbl">Reps</div><input type="number" class="gym-input" id="gym-r" value="'+(curr&&curr.sets&&curr.sets[GYM.s]?curr.sets[GYM.s].reps||'':'')+'"></div></div>'+(last?'<div class="gym-last">Último: '+last.w+'kg × '+last.r+'</div>':'')+'</div>';}
    document.getElementById('gym-body').innerHTML='<div class="gym-media">'+media+'</div><div class="gym-name">'+ex.name+'</div><div class="gym-target">'+ex.sets+'×'+ex.reps+' · '+ex.cat+'</div>'+(ex.notes?'<div class="gym-note">'+ex.notes+'</div>':'')+setsHtml+inputsHtml;
}

function gymNext(){
    const ex=GYM.exs[GYM.i],curr=DATA.current&&DATA.current.exercises&&DATA.current.exercises[GYM.i];
    if((ex.exType==='main'||ex.exType==='accessory')&&curr&&curr.sets){
        const wEl=document.getElementById('gym-w'),rEl=document.getElementById('gym-r');
        var newWeight = wEl&&wEl.value ? parseFloat(wEl.value) : 0;
        var newReps = rEl&&rEl.value ? parseFloat(rEl.value) : 0;
        if(newWeight > 0) curr.sets[GYM.s].weight = newWeight;
        if(newReps > 0) curr.sets[GYM.s].reps = newReps;
        // Check PR
        if(newWeight > 0 && newReps > 0) checkPR(ex.name, newWeight, newReps);
        save();GYM.s++;
        if(GYM.s<ex.sets){renderGymEx();showRest();return;}
    }
    if(curr)curr.completed=true;save();GYM.i++;GYM.s=0;renderGymEx();
}
function gymSkip(){GYM.i++;GYM.s=0;renderGymEx();}
function showRest(){let secs=(DATA.settings&&DATA.settings.rest)||90;document.getElementById('gym-rest-num').textContent=secs;document.getElementById('gym-rest').classList.add('active');GYM.restTimer=setInterval(function(){secs--;document.getElementById('gym-rest-num').textContent=secs;if(secs<=0)skipRest();},1000);}
function skipRest(){if(GYM.restTimer)clearInterval(GYM.restTimer);document.getElementById('gym-rest').classList.remove('active');}

// ============ BODY DATA (PESO Y MEDIDAS) ============
var MEASURES = [
    {id: 'weight', name: 'Peso', icon: '⚖️', unit: 'kg'},
    {id: 'chest', name: 'Pecho', icon: '👕', unit: 'cm'},
    {id: 'waist', name: 'Cintura', icon: '📏', unit: 'cm'},
    {id: 'hip', name: 'Cadera', icon: '🍑', unit: 'cm'},
    {id: 'arm', name: 'Brazo', icon: '💪', unit: 'cm'},
    {id: 'thigh', name: 'Muslo', icon: '🦵', unit: 'cm'}
];

if (!DATA.body) DATA.body = {weight: [], measures: {}, goal: null};
if (!DATA.body.weight) DATA.body.weight = [];
if (!DATA.body.measures) DATA.body.measures = {};
if (!DATA.body.goal) DATA.body.goal = null;

var currentMeasure = null;

function getTodayKey() {
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function getLatestMeasure(id) {
    if (id === 'weight') {
        return DATA.body.weight.length > 0 ? DATA.body.weight[DATA.body.weight.length - 1] : null;
    }
    var arr = DATA.body.measures[id] || [];
    return arr.length > 0 ? arr[arr.length - 1] : null;
}

function getMeasureChange(id) {
    var arr = id === 'weight' ? DATA.body.weight : (DATA.body.measures[id] || []);
    if (arr.length < 2) return null;
    return arr[arr.length - 1].value - arr[arr.length - 2].value;
}

function openMeasureModal(measureId) {
    currentMeasure = MEASURES.find(function(m) { return m.id === measureId; });
    if (!currentMeasure) return;
    
    document.getElementById('measure-modal-icon').textContent = currentMeasure.icon;
    document.getElementById('measure-modal-title').textContent = currentMeasure.name + ' (' + currentMeasure.unit + ')';
    
    var latest = getLatestMeasure(measureId);
    document.getElementById('measure-modal-input').value = latest ? latest.value : '';
    document.getElementById('measure-modal-input').placeholder = currentMeasure.unit;
    
    document.getElementById('measure-modal').classList.add('active');
    setTimeout(function() { document.getElementById('measure-modal-input').focus(); }, 100);
}

function closeMeasureModal() {
    document.getElementById('measure-modal').classList.remove('active');
    currentMeasure = null;
}

function saveMeasure() {
    if (!currentMeasure) return;
    var val = parseFloat(document.getElementById('measure-modal-input').value);
    if (isNaN(val) || val <= 0) {
        showToast('❌', 'Valor inválido');
        return;
    }
    
    var entry = {date: getTodayKey(), value: val};
    
    if (currentMeasure.id === 'weight') {
        // Comprobar si ya hay entrada de hoy
        var todayIdx = DATA.body.weight.findIndex(function(w) { return w.date === entry.date; });
        if (todayIdx >= 0) {
            DATA.body.weight[todayIdx] = entry;
        } else {
            DATA.body.weight.push(entry);
        }
    } else {
        if (!DATA.body.measures[currentMeasure.id]) DATA.body.measures[currentMeasure.id] = [];
        var arr = DATA.body.measures[currentMeasure.id];
        var todayIdx = arr.findIndex(function(m) { return m.date === entry.date; });
        if (todayIdx >= 0) {
            arr[todayIdx] = entry;
        } else {
            arr.push(entry);
        }
    }
    
    save();
    closeMeasureModal();
    renderBody();
    showToast('✅', currentMeasure.name + ' guardado');
    
    // Check if weight goal reached
    if (currentMeasure.id === 'weight' && DATA.body.goal) {
        var diff = Math.abs(val - DATA.body.goal);
        if (diff < 0.5) {
            showCelebration('🎯', '¡OBJETIVO ALCANZADO!', 'Has llegado a ' + val + ' kg');
        }
    }
}

function setWeightGoal() {
    var goal = prompt('¿Cuál es tu peso objetivo? (kg)', DATA.body.goal || '');
    if (goal !== null) {
        var val = parseFloat(goal);
        if (!isNaN(val) && val > 0) {
            DATA.body.goal = val;
            save();
            renderBody();
            showToast('🎯', 'Objetivo: ' + val + ' kg');
        }
    }
}

function renderBody() {
    var html = '';
    var latestWeight = getLatestMeasure('weight');
    var weightChange = getMeasureChange('weight');
    
    // Weight Card
    html += '<div class="weight-card">';
    html += '<div class="stats-card-title">⚖️ Peso Corporal</div>';
    
    if (latestWeight) {
        html += '<div class="weight-header"><div class="weight-current"><div class="weight-big">' + latestWeight.value.toFixed(1) + '</div><div class="weight-unit">kg</div></div>';
        if (weightChange !== null) {
            var changeClass = weightChange > 0 ? 'up' : weightChange < 0 ? 'down' : 'same';
            var changeIcon = weightChange > 0 ? '↑' : weightChange < 0 ? '↓' : '=';
            html += '<div class="weight-change ' + changeClass + '">' + changeIcon + ' ' + Math.abs(weightChange).toFixed(1) + ' kg</div>';
        }
        html += '</div>';
    }
    
    // Weight Input
    html += '<div class="weight-input-row"><input type="number" step="0.1" class="weight-input" id="quick-weight" placeholder="Peso hoy (kg)" value=""><button class="weight-btn" onclick="quickSaveWeight()">+ Añadir</button></div>';
    
    // Weight Goal
    if (DATA.body.goal) {
        var diff = latestWeight ? (DATA.body.goal - latestWeight.value) : 0;
        var diffClass = diff > 0 ? 'negative' : 'positive';
        html += '<div class="weight-goal" onclick="setWeightGoal()"><div class="weight-goal-icon">🎯</div><div class="weight-goal-info"><div class="weight-goal-label">OBJETIVO</div><div class="weight-goal-val">' + DATA.body.goal.toFixed(1) + ' kg</div></div>';
        if (latestWeight) {
            html += '<div class="weight-goal-diff ' + diffClass + '">' + (diff > 0 ? '+' : '') + diff.toFixed(1) + ' kg</div>';
        }
        html += '</div>';
    } else {
        html += '<div class="weight-goal" onclick="setWeightGoal()" style="cursor:pointer;justify-content:center;color:var(--text2)"><span>🎯 Establecer objetivo de peso</span></div>';
    }
    
    // Weight Chart (últimos 14 días)
    if (DATA.body.weight.length > 1) {
        var last14 = DATA.body.weight.slice(-14);
        var minW = Math.min.apply(null, last14.map(function(w){return w.value;})) - 1;
        var maxW = Math.max.apply(null, last14.map(function(w){return w.value;})) + 1;
        var range = maxW - minW || 1;
        
        html += '<div class="weight-chart"><div class="weight-chart-bars">';
        last14.forEach(function(w) {
            var pct = ((w.value - minW) / range) * 100;
            html += '<div class="weight-chart-bar" style="height:' + pct + '%" data-val="' + w.value + 'kg"></div>';
        });
        html += '</div><div class="weight-chart-labels"><span class="weight-chart-label">' + last14[0].date.slice(5) + '</span><span class="weight-chart-label">' + last14[last14.length-1].date.slice(5) + '</span></div></div>';
    }
    
    html += '</div>';
    
    // Measures Grid
    html += '<div class="stats-card"><div class="stats-card-title">📐 Medidas Corporales</div>';
    html += '<div class="measures-grid">';
    
    MEASURES.forEach(function(m) {
        if (m.id === 'weight') return; // Skip weight in grid
        var latest = getLatestMeasure(m.id);
        var change = getMeasureChange(m.id);
        
        html += '<div class="measure-box" onclick="openMeasureModal(\'' + m.id + '\')">';
        html += '<div class="measure-icon">' + m.icon + '</div>';
        html += '<div class="measure-name">' + m.name + '</div>';
        html += '<div class="measure-val">' + (latest ? latest.value.toFixed(1) : '--') + ' <span>' + m.unit + '</span></div>';
        if (change !== null) {
            var changeClass = change > 0 ? 'up' : change < 0 ? 'down' : '';
            var sign = change > 0 ? '+' : '';
            html += '<div class="measure-change ' + changeClass + '">' + sign + change.toFixed(1) + '</div>';
        }
        html += '</div>';
    });
    
    html += '</div></div>';
    
    // Weight History
    if (DATA.body.weight.length > 0) {
        html += '<div class="stats-card"><div class="stats-card-title">📜 Historial de Peso</div>';
        html += '<div class="weight-history">';
        var hist = DATA.body.weight.slice().reverse().slice(0, 10);
        hist.forEach(function(w, i) {
            var prev = hist[i + 1];
            var diff = prev ? (w.value - prev.value) : 0;
            var diffClass = diff > 0 ? 'up' : diff < 0 ? 'down' : 'same';
            var diffHtml = diff !== 0 ? '<span class="weight-history-diff weight-change ' + diffClass + '">' + (diff > 0 ? '+' : '') + diff.toFixed(1) + '</span>' : '';
            html += '<div class="weight-history-item"><span class="weight-history-date">' + w.date + '</span><span class="weight-history-val">' + w.value.toFixed(1) + ' kg ' + diffHtml + '</span></div>';
        });
        html += '</div></div>';
    }
    
    document.getElementById('body-content').innerHTML = html;
}

function quickSaveWeight() {
    var input = document.getElementById('quick-weight');
    var val = parseFloat(input.value);
    if (isNaN(val) || val <= 0) {
        showToast('❌', 'Introduce un peso válido');
        return;
    }
    
    var entry = {date: getTodayKey(), value: val};
    var todayIdx = DATA.body.weight.findIndex(function(w) { return w.date === entry.date; });
    if (todayIdx >= 0) {
        DATA.body.weight[todayIdx] = entry;
    } else {
        DATA.body.weight.push(entry);
    }
    
    save();
    input.value = '';
    renderBody();
    showToast('✅', 'Peso guardado: ' + val + ' kg');
    
    // Check goal
    if (DATA.body.goal && Math.abs(val - DATA.body.goal) < 0.5) {
        showCelebration('🎯', '¡OBJETIVO ALCANZADO!', 'Has llegado a ' + val + ' kg');
    }
}

// ============ CLOUD SYNC CON GOOGLE SHEETS ============
var CLOUD = {
    url: localStorage.getItem('gym_cloud_url') || 'https://script.google.com/macros/s/AKfycbz0X5grZNuOfd4j6hE4YvLeJ79uWhpUxVRct5kxmbhUXkabff6a18faujyq-KorLeVW/exec',
    lastSync: localStorage.getItem('gym_last_sync') || null,
    autoSync: localStorage.getItem('gym_auto_sync') !== 'false'
};

function updateSyncIndicator(status) {
    var indicator = document.getElementById('sync-indicator');
    indicator.className = 'sync-indicator';
    if (status === 'online') indicator.classList.add('online');
    else if (status === 'syncing') indicator.classList.add('syncing');
}

function cloudSave() {
    if (!CLOUD.url) return Promise.resolve();
    
    updateSyncIndicator('syncing');
    
    var allData = {
        lib: LIB,
        plan: PLAN,
        data: DATA
    };
    
    return fetch(CLOUD.url + '?action=save&key=gymdata&data=' + encodeURIComponent(JSON.stringify(allData)))
        .then(function(r) { return r.json(); })
        .then(function(result) {
            if (result.success) {
                CLOUD.lastSync = new Date().toISOString();
                localStorage.setItem('gym_last_sync', CLOUD.lastSync);
                updateSyncIndicator('online');
                return true;
            }
            throw new Error(result.error);
        })
        .catch(function(err) {
            console.error('Cloud save error:', err);
            updateSyncIndicator('offline');
            return false;
        });
}

function cloudLoad() {
    if (!CLOUD.url) return Promise.resolve(null);
    
    updateSyncIndicator('syncing');
    
    return fetch(CLOUD.url + '?action=load')
        .then(function(r) { return r.json(); })
        .then(function(result) {
            if (result.success && result.data && result.data.gymdata) {
                var cloudData = result.data.gymdata;
                if (cloudData.lib) LIB = cloudData.lib;
                if (cloudData.plan) PLAN = cloudData.plan;
                if (cloudData.data) {
                    DATA = cloudData.data;
                    // Asegurar campos nuevos
                    if (!DATA.xp) DATA.xp = 0;
                    if (!DATA.badges) DATA.badges = [];
                    if (!DATA.bestStreak) DATA.bestStreak = 0;
                    if (!DATA.body) DATA.body = {weight: [], measures: {}, goal: null};
                }
                // Guardar en local también
                localStorage.setItem('gp_lib', JSON.stringify(LIB));
                localStorage.setItem('gp_plan', JSON.stringify(PLAN));
                localStorage.setItem('gp_data', JSON.stringify(DATA));
                
                CLOUD.lastSync = new Date().toISOString();
                localStorage.setItem('gym_last_sync', CLOUD.lastSync);
                updateSyncIndicator('online');
                return true;
            }
            updateSyncIndicator('online');
            return false;
        })
        .catch(function(err) {
            console.error('Cloud load error:', err);
            updateSyncIndicator('offline');
            return false;
        });
}

function connectCloud() {
    var url = document.getElementById('cloud-url').value.trim();
    if (!url) {
        showToast('❌', 'Introduce la URL del script');
        return;
    }
    
    CLOUD.url = url;
    localStorage.setItem('gym_cloud_url', url);
    
    // Test connection
    updateSyncIndicator('syncing');
    fetch(url + '?action=init')
        .then(function(r) { return r.json(); })
        .then(function(result) {
            if (result.success) {
                showToast('✅', '¡Conectado a Google Sheets!');
                updateSyncIndicator('online');
                CLOUD.autoSync = true;
                localStorage.setItem('gym_auto_sync', 'true');
                renderConfig();
                // Preguntar si cargar datos de la nube
                if (confirm('¿Cargar datos desde la nube?\n(Sí = cargar de la nube, No = subir datos actuales)')) {
                    cloudLoad().then(function() {
                        renderToday();
                        showToast('☁️', 'Datos cargados de la nube');
                    });
                } else {
                    cloudSave().then(function() {
                        showToast('☁️', 'Datos subidos a la nube');
                    });
                }
            } else {
                throw new Error(result.error);
            }
        })
        .catch(function(err) {
            showToast('❌', 'Error: ' + err.message);
            updateSyncIndicator('offline');
        });
}

function disconnectCloud() {
    if (confirm('¿Desconectar de la nube?\nLos datos locales se mantendrán.')) {
        CLOUD.url = '';
        CLOUD.autoSync = false;
        localStorage.removeItem('gym_cloud_url');
        localStorage.removeItem('gym_auto_sync');
        updateSyncIndicator('');
        renderConfig();
        showToast('☁️', 'Desconectado de la nube');
    }
}

function manualSync() {
    if (!CLOUD.url) {
        showToast('❌', 'No conectado a la nube');
        return;
    }
    showToast('🔄', 'Sincronizando...');
    cloudSave().then(function(ok) {
        if (ok) showToast('✅', 'Sincronizado correctamente');
        else showToast('❌', 'Error al sincronizar');
        renderConfig();
    });
}

function forceCloudLoad() {
    if (!CLOUD.url) {
        showToast('❌', 'No conectado a la nube');
        return;
    }
    if (confirm('¿Cargar datos de la nube?\nEsto reemplazará los datos locales.')) {
        showToast('🔄', 'Cargando...');
        cloudLoad().then(function(ok) {
            if (ok) {
                showToast('✅', 'Datos cargados');
                renderToday();
            } else {
                showToast('❌', 'Error o sin datos en la nube');
            }
            renderConfig();
        });
    }
}

// Modificar save() para auto-sync
var originalSave = save;
save = function() {
    originalSave();
    if (CLOUD.autoSync && CLOUD.url) {
        // Debounce: esperar 2 segundos antes de sincronizar
        clearTimeout(window.syncTimeout);
        window.syncTimeout = setTimeout(function() {
            cloudSave();
        }, 2000);
    }
};

function renderConfig() {
    var html = '';

function downloadAppsScript() {
    var code = `// ========================================
// GOOGLE APPS SCRIPT - GYM PRO DATABASE
// ========================================

function doGet(e) { return handleRequest(e); }
function doPost(e) { return handleRequest(e); }

function handleRequest(e) {
  var sheet = SpreadsheetApp.getActiveSpreadsheet().getActiveSheet();
  var action = e.parameter.action;
  var output;
  
  try {
    if (action === 'load') {
      output = loadData(sheet);
    } else if (action === 'save') {
      output = saveData(sheet, e.parameter.key, e.parameter.data);
    } else if (action === 'init') {
      output = initSheet(sheet);
    } else {
      output = {success: false, error: 'Acción no válida'};
    }
  } catch (error) {
    output = {success: false, error: error.toString()};
  }
  
  return ContentService.createTextOutput(JSON.stringify(output)).setMimeType(ContentService.MimeType.JSON);
}

function initSheet(sheet) {
  var headers = sheet.getRange(1, 1, 1, 3).getValues()[0];
  if (headers[0] !== 'key') {
    sheet.getRange(1, 1, 1, 3).setValues([['key', 'data', 'updated']]);
  }
  return {success: true, message: 'OK'};
}

function loadData(sheet) {
  var data = sheet.getDataRange().getValues();
  var result = {};
  for (var i = 1; i < data.length; i++) {
    if (data[i][0] && data[i][1]) {
      try { result[data[i][0]] = JSON.parse(data[i][1]); }
      catch (e) { result[data[i][0]] = data[i][1]; }
    }
  }
  return {success: true, data: result};
}

function saveData(sheet, key, data) {
  var values = sheet.getDataRange().getValues();
  var now = new Date().toISOString();
  var found = false;
  
  for (var i = 1; i < values.length; i++) {
    if (values[i][0] === key) {
      sheet.getRange(i + 1, 2).setValue(data);
      sheet.getRange(i + 1, 3).setValue(now);
      found = true;
      break;
    }
  }
  
  if (!found) sheet.appendRow([key, data, now]);
  return {success: true, message: 'OK'};
}

// 6. Implementar y copiar URL`;
    
    var blob = new Blob([code], {type: 'text/javascript'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'GymPro-AppsScript.js';

}
