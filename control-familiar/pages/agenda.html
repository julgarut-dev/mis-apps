<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>📅 Agenda - Control Familiar</title>
  <link rel="stylesheet" href="../css/app.css" />
  <link rel="stylesheet" href="../css/shell.css" />
</head>
<body>
  <div class="container">
    <div class="hero">
      <div class="top">
        <div>
          <div class="hello">📅 Agenda</div>
          <div class="sub">Vista tipo agenda: hoy, mañana y próximos</div>
        </div>
        <div class="pill" id="btnAddEvent" style="cursor:pointer">➕ Evento</div>
      </div>
    </div>

    <div class="card">
      <div class="row" style="justify-content:space-between">
        <div style="font-weight:950">Hoy</div>
        <span class="badge" id="todayBadge">—</span>
      </div>
      <div class="sep"></div>
      <div id="todayList"></div>
    </div>

    <div class="card">
      <div class="row" style="justify-content:space-between">
        <div style="font-weight:950">Mañana</div>
        <span class="badge" id="tomBadge">—</span>
      </div>
      <div class="sep"></div>
      <div id="tomList"></div>
    </div>

    <div class="card">
      <div class="row" style="justify-content:space-between">
        <div style="font-weight:950">Próximos 14 días</div>
        <span class="badge">Eventos + Tareas</span>
      </div>
      <div class="sep"></div>
      <div id="upcoming"></div>
    </div>
  </div>

  <div class="modal" id="eventModal">
    <div class="sheet">
      <div class="row" style="justify-content:space-between">
        <h3>➕ Nuevo evento</h3>
        <button class="btn secondary" style="width:auto;padding:10px 12px;border-radius:14px" id="closeModal">✕</button>
      </div>
      <div class="sep"></div>
      <div class="small" style="margin-bottom:6px">Título</div>
      <input class="input" id="evTitle" placeholder="Ej: Tutoría, cumpleaños, cita médico…" />
      <div class="sep"></div>
      <div class="small" style="margin-bottom:6px">Fecha</div>
      <input class="input" type="date" id="evDate" />
      <div class="sep"></div>
      <div class="row">
        <button class="btn" id="saveEvent">Guardar</button>
      </div>
      <div class="small" style="margin-top:10px">Tip: estos eventos salen en Inicio → Checklist.</div>
    </div>
  </div>

  <script src="../js/cloud_store.js"></script>
  <script src="../js/family_sync_kv.js"></script>
  <script src="../js/agenda.js"></script>
  <script src="../js/shell.js"></script>
</body>
</html>
