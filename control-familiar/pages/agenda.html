<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>📅 Agenda - Control Familiar</title>
  <link rel="stylesheet" href="../css/app.css" />
  <link rel="stylesheet" href="../css/shell.css" />
  <style>
    .event-type-selector{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
    .event-type-btn{padding:8px 12px;border:2px solid var(--border);border-radius:10px;background:#fff;cursor:pointer;font-size:.75rem;font-weight:600;transition:all .2s}
    .event-type-btn.active{color:#fff}
    .event-type-btn.medico{border-color:#ef4444}.event-type-btn.medico.active{background:#ef4444}
    .event-type-btn.trabajo{border-color:#3b82f6}.event-type-btn.trabajo.active{background:#3b82f6}
    .event-type-btn.ocio{border-color:#10b981}.event-type-btn.ocio.active{background:#10b981}
    .event-type-btn.cumple{border-color:#f59e0b}.event-type-btn.cumple.active{background:#f59e0b}
    .event-type-btn.familia{border-color:#8b5cf6}.event-type-btn.familia.active{background:#8b5cf6}
    .event-type-btn.otro{border-color:#64748b}.event-type-btn.otro.active{background:#64748b}
    .event-badge{padding:3px 8px;border-radius:6px;font-size:.65rem;font-weight:700;color:#fff}
    .event-badge.medico{background:#ef4444}
    .event-badge.trabajo{background:#3b82f6}
    .event-badge.ocio{background:#10b981}
    .event-badge.cumple{background:#f59e0b}
    .event-badge.familia{background:#8b5cf6}
    .event-badge.otro{background:#64748b}
    .recur-badge{font-size:.6rem;color:var(--muted);margin-left:6px}
  </style>
</head>
<body>
  <div class="container">
    <div class="hero">
      <div class="top">
        <div>
          <div class="hello">📅 Agenda</div>
          <div class="sub">Vista tipo agenda: hoy, mañana y próximos</div>
        </div>
        <div class="pill" id="btnAddEvent" style="cursor:pointer">➕ Evento</div>
      </div>
    </div>

    <div class="card">
      <div class="row" style="justify-content:space-between">
        <div style="font-weight:950">Hoy</div>
        <span class="badge" id="todayBadge">—</span>
      </div>
      <div class="sep"></div>
      <div id="todayList"></div>
    </div>

    <div class="card">
      <div class="row" style="justify-content:space-between">
        <div style="font-weight:950">Mañana</div>
        <span class="badge" id="tomBadge">—</span>
      </div>
      <div class="sep"></div>
      <div id="tomList"></div>
    </div>

    <div class="card">
      <div class="row" style="justify-content:space-between">
        <div style="font-weight:950">Próximos 14 días</div>
        <span class="badge">Eventos + Tareas</span>
      </div>
      <div class="sep"></div>
      <div id="upcoming"></div>
    </div>
  </div>

  <div class="modal" id="eventModal">
    <div class="sheet">
      <div class="row" style="justify-content:space-between">
        <h3>➕ Nuevo evento</h3>
        <button class="btn secondary" style="width:auto;padding:10px 12px;border-radius:14px" id="closeModal">✕</button>
      </div>
      <div class="sep"></div>
      <div class="small" style="margin-bottom:6px">Título</div>
      <input class="input" id="evTitle" placeholder="Ej: Tutoría, cumpleaños, cita médico…" />
      <div class="sep"></div>
      <div class="small" style="margin-bottom:6px">Tipo</div>
      <div class="event-type-selector" id="eventTypeSelector">
        <button type="button" class="event-type-btn medico" onclick="setEventType('medico')">🏥 Médico</button>
        <button type="button" class="event-type-btn trabajo" onclick="setEventType('trabajo')">💼 Trabajo</button>
        <button type="button" class="event-type-btn ocio" onclick="setEventType('ocio')">🎉 Ocio</button>
        <button type="button" class="event-type-btn cumple" onclick="setEventType('cumple')">🎂 Cumple</button>
        <button type="button" class="event-type-btn familia" onclick="setEventType('familia')">👨‍👩‍👧 Familia</button>
        <button type="button" class="event-type-btn otro active" onclick="setEventType('otro')">📌 Otro</button>
      </div>
      <div class="sep"></div>
      <div class="small" style="margin-bottom:6px">Fecha</div>
      <input class="input" type="date" id="evDate" />
      <div class="sep"></div>
      <div class="small" style="margin-bottom:6px">🔁 Repetir</div>
      <select class="input" id="evRecur">
        <option value="">No repetir</option>
        <option value="daily">Cada día</option>
        <option value="weekly">Cada semana</option>
        <option value="monthly">Cada mes</option>
        <option value="yearly">Cada año</option>
      </select>
      <div class="sep"></div>
      <div class="row">
        <button class="btn" id="saveEvent">Guardar</button>
      </div>
    </div>
  </div>

  <script src="../js/cloud_store.js"></script>
  <script src="../js/family_sync_kv.js"></script>
  <script>
  var currentEventType = 'otro';
  
  function setEventType(type) {
    currentEventType = type;
    document.querySelectorAll('.event-type-btn').forEach(function(btn) {
      btn.classList.remove('active');
      if (btn.classList.contains(type)) btn.classList.add('active');
    });
  }
  </script>
  <script src="../js/agenda.js"></script>
  <script src="../js/shell.js"></script>
</body>
</html>
